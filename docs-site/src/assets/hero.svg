<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ctp-latte-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8839ef" />
      <stop offset="50%" stop-color="#7287fd" />
      <stop offset="100%" stop-color="#179299" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="400" height="400" rx="40" fill="#e6e9ef" />
  
  <!-- Outer Denoising Ring -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#ccd0da" stroke-width="4" stroke-dasharray="8 8" />
  
  <!-- Canvas Tiles -->
  <g filter="url(#soft-glow)">
    <rect x="130" y="130" width="60" height="60" rx="14" fill="#8839ef" opacity="0.9" />
    <rect x="210" y="130" width="60" height="60" rx="14" fill="#7287fd" opacity="0.9" />
    <rect x="130" y="210" width="60" height="60" rx="14" fill="#179299" opacity="0.9" />
    <rect x="210" y="210" width="60" height="60" rx="14" fill="#fe640b" opacity="0.9" />
  </g>
  
  <!-- Inner Core -->
  <circle cx="200" cy="200" r="32" fill="url(#ctp-latte-grad)" />
  <circle cx="200" cy="200" r="14" fill="#eff1f5" />
</svg>

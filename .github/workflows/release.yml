name: Release CLI Binaries

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    name: Build & Attach Release Archives
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js for Decision Studio embed
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'studio/package-lock.json'

      - name: Build Decision Studio assets (studio/dist)
        run: |
          npm --prefix studio ci --no-audit --no-fund
          npm --prefix studio run build

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Cross-compile release archives and SHA256SUMS
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: invalid release tag '${RELEASE_TAG}'" >&2
            exit 1
          fi

          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          LDFLAGS="-s -w -X github.com/GoogleCloudPlatform/dgem/cmd.Version=${RELEASE_TAG} -X github.com/GoogleCloudPlatform/dgem/cmd.Commit=${COMMIT} -X github.com/GoogleCloudPlatform/dgem/cmd.Date=${DATE}"

          rm -rf dist/release dist/stage
          mkdir -p dist/release

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            STAGE_DIR="dist/stage/${GOOS}_${GOARCH}"
            ARCHIVE="dgem_${RELEASE_TAG}_${GOOS}_${GOARCH}.tar.gz"

            mkdir -p "${STAGE_DIR}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags="${LDFLAGS}" -o "${STAGE_DIR}/dgem" .

            cp LICENSE README.md "${STAGE_DIR}/"
            cp -R templates "${STAGE_DIR}/templates"

            tar -C "${STAGE_DIR}" -czf "dist/release/${ARCHIVE}" dgem LICENSE README.md templates
          done

          VERSION_OUT="$("dist/stage/linux_amd64/dgem" --version)"
          echo "Verified linux/amd64 binary: ${VERSION_OUT}"
          case "${VERSION_OUT}" in
            *"${RELEASE_TAG} (revision ${COMMIT}, built ${DATE})"*) ;;
            *)
              echo "error: unexpected --version output: ${VERSION_OUT}" >&2
              exit 1
              ;;
          esac

          (
            cd dist/release
            sha256sum dgem_*.tar.gz > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          ls -lh dist/release

      - name: Attach archives to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --verify-tag \
              --title "dgem ${RELEASE_TAG}" \
              --notes "Draft release created automatically for tag ${RELEASE_TAG}. Add release notes from CHANGELOG.md before publishing."
          fi

          gh release upload "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            dist/release/dgem_*.tar.gz \
            dist/release/SHA256SUMS

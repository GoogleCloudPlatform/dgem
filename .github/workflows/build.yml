name: CI & Docs Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, ospo-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pushes and manual runs share one group, so Pages deployments never overlap and are never cancelled midway. Each pull
  # request gets its own group: concurrent PRs do not queue behind (or replace) one another, and a new push to a PR
  # cancels that PR's earlier run.
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-go:
    name: Test & Build Go CLI (dgem)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...

      - name: Build dgem binary
        run: make build

  test-matrix:
    name: Regression matrix unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: pip install -r scripts/requirements-matrix.txt

      - name: Run matrix unit tests
        run: python -m unittest scripts/matrix/test_matrix.py

      - name: Check the serving patch re-applies to the upstream file
        run: |
          cp deploy/cloudrun/server/structured_server.upstream.py /tmp/ss.py
          patch -s /tmp/ss.py deploy/cloudrun/server/dgem.patch
          cmp /tmp/ss.py deploy/cloudrun/server/structured_server.py

  build-docs:
    name: Build Starlight Docs Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs/ and docs-site/ parity and relative links
        run: |
          python3 scripts/docs_sync_check.py
          python3 scripts/docs_link_check.py

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true # runner cache can lag (22.23.3); Astro 7.4 needs >= 22.23.4
          cache: 'pnpm'
          cache-dependency-path: 'docs-site/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: docs-site
        run: pnpm install

      - name: Build Astro Starlight Site
        working-directory: docs-site
        run: pnpm build

      - name: Upload GitHub Pages Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy-docs:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-go, build-docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

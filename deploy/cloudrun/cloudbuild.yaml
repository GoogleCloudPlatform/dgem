# Serving image build with the release version baked in (labels, env, /health).
# Used by scripts/build_cloudrun_image.sh (`make cloudrun-build`), or directly:
#   gcloud builds submit deploy/cloudrun --project=<PROJECT> --config=deploy/cloudrun/cloudbuild.yaml \
#     --substitutions=_IMAGE=us-central1-docker.pkg.dev/<PROJECT>/dgem/dgemma,_TAG=<git sha>,_VERSION=<git describe>
# Only _TAG is pushed; add more tags afterwards with `gcloud artifacts docker tags add`.
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/dgem/dgemma
  _TAG: dev
  _VERSION: dev
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=DGEM_VERSION=${_VERSION}
      - --build-arg=DGEM_REVISION=${_TAG}
      - -t
      - ${_IMAGE}:${_TAG}
      - .
images:
  - ${_IMAGE}:${_TAG}
options:
  machineType: E2_HIGHCPU_32
  dynamicSubstitutions: true
timeout: 2400s

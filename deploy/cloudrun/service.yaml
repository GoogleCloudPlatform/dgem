apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: diffusiongemma-vllm
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "false"
        autoscaling.knative.dev/maxScale: "2"
        autoscaling.knative.dev/minScale: "0"
    spec:
      containerConcurrency: 32
      timeoutSeconds: 300
      containers:
      - name: vllm-diffusiongemma
        image: gcr.io/PROJECT_ID/vllm-diffgemma:pr57250
        args:
        - "serve"
        - "nvidia/diffusiongemma-26B-A4B-it-NVFP4"
        - "--diffusion-config"
        - "{\"canvas_length\": 32}"
        - "--max-logprobs"
        - "32"
        - "--enable-prefix-caching"
        - "--port"
        - "8080"
        - "--host"
        - "0.0.0.0"
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            cpu: "8"
            memory: "32Gi"
            nvidia.com/gpu: "1"
        nodeSelector:
          run.googleapis.com/accelerator: nvidia-l4
        startupProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 240
          periodSeconds: 240
          failureThreshold: 1
          timeoutSeconds: 240
